name: Daily Action Setup Security Audit

# Referencia de diseño: workflow daily-action-setup-security-audit de
# GitHub Agentic Workflows. Audita este repositorio a diario, rota los
# aspectos de seguridad revisados y publica el reporte como artifact y commit.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-action-setup-security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore reporter rotation state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .reporter_state.json
          key: reporter-state-${{ github.run_number }}
          restore-keys: |
            reporter-state-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Reporter
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT || '60' }}
        run: |
          python -m reporter.cli \
            --repo-root . \
            --output reports/security_audit_report.md \
            --state-file .reporter_state.json \
            --rotate-aspects

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-audit-report
          path: reports/security_audit_report.md
          retention-days: 30
          if-no-files-found: error

      - name: Commit report if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- reports/security_audit_report.md; then
            echo "Sin cambios en el reporte; no se crea commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/security_audit_report.md
          git commit -m "chore(reporter): actualizar auditoría de seguridad diaria"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
