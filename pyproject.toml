[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-miner"
version = "0.1.0"
description = "A GitHub organization vulnerability miner using CodeQL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
analysis = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "jupyter",
    "nbconvert",
    "ipykernel",
    "numpy",
]
visualizer = [
    "dash>=3.0",
    "pandas>=2.0",
]

[project.scripts]
miner = "miner.cli:app"
visualizer = "visualizer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["miner*", "analyzer*", "reporter*", "visualizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
